services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmic-gateway-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cosmic
      POSTGRES_PASSWORD: cosmic
      POSTGRES_DB: cosmic_gateway
    volumes:
      - cosmic_gateway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic -d cosmic_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosmic_gateway_pgdata:
